name: Build private RunPod image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Do not create or publish a public bundled package while upstream permissions are unresolved.
      - name: Resolve package and verify existing private visibility
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          package="${repo#*/}"
          owner_type=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .owner.type)
          namespace=users
          if [ "$owner_type" = Organization ]; then namespace=orgs; fi
          package_api="${namespace}/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}"
          visibility=$(gh api "$package_api" --jq .visibility)
          test "$visibility" = private
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "package_api=${package_api}" >> "$GITHUB_OUTPUT"
      - name: Free hosted-runner space for CUDA wheels
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: false
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_API: ${{ steps.image.outputs.package_api }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          visibility=$(gh api "$PACKAGE_API" --jq .visibility)
          test "$visibility" = private
          echo "Verified private package: ${IMAGE}:${GITHUB_SHA}"
