name: Build private RunPod image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free hosted-runner space for CUDA wheels
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ipolluxx/fork-microscope:${{ github.sha }}
          provenance: false
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api users/ipolluxx/packages/container/fork-microscope --jq .visibility)
          test "$visibility" = private
          echo "Verified private package: ghcr.io/ipolluxx/fork-microscope:${GITHUB_SHA}"
